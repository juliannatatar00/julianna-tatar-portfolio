<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julianna Tatar · Portfolio</title>
<meta name="description" content="Portfolio of Julianna Tatar, Communication and Media Studies student with a minor in Philosophy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Mrs+Saint+Delafield&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site"></div>

<!-- Page sections. Edit text and layout here. -->
<template id="tpl-Main">
<div class="page site" style="font-family: Jost, 'Helvetica Neue', Arial, sans-serif; font-weight: 300; color: #2f4156; background: #f5efeb">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none"><img src="assets/martin-slovak-hills.jpg" alt="" style="width: 1px; height: 1px"><img src="assets/vienna-collage.jpg" alt="" style="width: 1px; height: 1px"></div>
  <dc-import name="Nav" mode="scroll" hide-logo="{{yes}}" hint-size="100%,96px"></dc-import>
  <section id="top" class="slide" style="justify-content: flex-start; background: #f5efeb; box-sizing: border-box; padding: 28px clamp(20px, 4vw, 56px) 56px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px 40px">
    <a href="#top" onClick="{{goTop}}" style="display: inline-flex; flex-direction: column; text-decoration: none; color: #2f4156"><span style="font-family: &quot;Instrument Serif&quot;, Georgia, serif; font-size: clamp(40px, 5vw, 66px); line-height: 0.86; text-transform: uppercase">Julianna</span><span style="font-family: &quot;Instrument Serif&quot;, Georgia, serif; font-size: clamp(40px, 5vw, 66px); line-height: 0.86; text-transform: uppercase">Tatar</span><span style="align-self: flex-end; margin-top: 4px; font-family: &quot;Mrs Saint Delafield&quot;, cursive; font-size: clamp(40px, 5vw, 64px); line-height: 0.9; color: rgb(86, 124, 141)">Portfolio</span></a>
    </div>
    <div style="width: 100%; max-width: 1060px; margin: clamp(24px, 4vw, 48px) auto 0">
      <h1 aria-label="Hello, I’m Julianna" style="margin: 0; position: relative; padding: clamp(34px, 5.6vw, 84px) clamp(0px, 4vw, 48px) clamp(34px, 5.6vw, 84px) clamp(16px, 7vw, 96px); font-weight: 400">
        <img class="rise" src="assets/hero-julianna.jpg" alt="Julianna smiling outdoors under a tree in golden light" style="display: block; width: 100%; aspect-ratio: 5 / 2; object-fit: cover; object-position: 50% 30%">
        <span class="rise2" aria-hidden="true" style="position: absolute; top: 0; left: 0; z-index: 1; font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(56px, 9vw, 128px); line-height: 0.78; text-transform: uppercase; color: #2f4156">Hello,</span>
        <span class="rise3" aria-hidden="true" style="position: absolute; right: 0; bottom: 0; z-index: 1; font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(56px, 9vw, 128px); line-height: 0.78; text-transform: uppercase; white-space: nowrap; color: #2f4156">I’m Julianna</span>
      </h1>
      <div style="margin-top: 32px; display: flex; flex-wrap: wrap-reverse; justify-content: space-between; align-items: flex-end; gap: 32px">
        <a class="pill" href="#journey" onClick="{{goJourney}}" style="display: inline-flex; align-items: center; padding: 14px 34px; border: 1px solid #2f4156; border-radius: 999px; font-size: 13px; font-weight: 400; letter-spacing: 0.12em; text-decoration: none">FOLLOW MY JOURNEY</a>
        <p class="rise3" style="margin: 0 0 0 auto; text-align: right; font-size: 14px; font-weight: 400; line-height: 1.75; letter-spacing: 0.14em">COMMUNICATION AND MEDIA STUDIES STUDENT<br>WITH A MINOR IN PHILOSOPHY</p>
      </div>
    </div>
  </section>

  <section id="about" class="slide">
    <dc-import name="Nav" mode="scroll" current="about" hint-size="100%,96px"></dc-import>
    <dc-import name="About" embedded="{{yes}}" hint-size="100%,1000px"></dc-import>
  </section>

  <section id="journey" class="slide">
    <dc-import name="Nav" mode="scroll" current="journey" hint-size="100%,96px"></dc-import>
    <dc-import name="Journey" embedded="{{yes}}" hint-size="100%,1000px"></dc-import>
  </section>

  <section id="writing" class="slide">
    <dc-import name="Nav" mode="scroll" current="writing" hint-size="100%,96px"></dc-import>
    <dc-import name="Writing" embedded="{{yes}}" hint-size="100%,2300px"></dc-import>
  </section>

  <section id="contact" class="slide">
    <dc-import name="Nav" mode="scroll" current="contact" hint-size="100%,96px"></dc-import>
    <dc-import name="Contact" embedded="{{yes}}" hint-size="100%,900px"></dc-import>
  </section>
</div>
</template>
<template id="tpl-Nav">
<header style="font-family: Jost, 'Helvetica Neue', Arial, sans-serif; color: #2f4156; background: #f5efeb; width: 100%; box-sizing: border-box; padding: 24px clamp(20px, 4vw, 56px); display: flex; flex-wrap: wrap; justify-content: {{justify}}; align-items: center; gap: 12px 40px; border-bottom: 1px solid rgba(47, 65, 86, 0.12)">
  <sc-if value="{{showLogo}}" hint-placeholder-val="{{true}}">
  <a href="{{homeHref}}" onClick="{{goHome}}" style="display: inline-flex; align-items: baseline; gap: 10px; text-decoration: none; color: #2f4156">
    <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 34px; line-height: 1; text-transform: uppercase">Julianna Tatar</span>
    <span style="font-family: 'Mrs Saint Delafield', cursive; font-size: 30px; line-height: 0.8; color: #567c8d">Portfolio</span>
  </a>
  </sc-if>
  <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px 36px">
    <sc-for list="{{links}}" as="l" hint-placeholder-count="5">
      <a href="{{l.href}}" onClick="{{l.go}}" class="ul navlink {{l.cls}}" aria-current="{{l.cur}}" style="padding: 12px 0; font-size: 16px; font-weight: 400; letter-spacing: 0.14em; text-decoration: none">{{l.label}}</a>
    </sc-for>
  </nav>
</header>
</template>
<template id="tpl-About">
<div class="page" style="font-family: Jost, 'Helvetica Neue', Arial, sans-serif; font-weight: 300; color: #2f4156; background: #f5efeb">
  <sc-if value="{{showNav}}" hint-placeholder-val="{{true}}">
    <dc-import name="Nav" current="about" hint-size="100%,112px"></dc-import>
  </sc-if>
  <section id="about" style="background: #f5efeb; padding: 32px clamp(20px, 4vw, 56px) 72px">
    <div style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; text-align: center">
      <div style="display: flex; flex-direction: column; align-items: center">
        <p style="margin: 0; font-family: 'Mrs Saint Delafield', cursive; font-size: 42px; line-height: 0.8; color: #567c8d">about me</p>
        <h2 style="margin: 4px 0 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(40px, 5vw, 64px); line-height: 0.98; letter-spacing: -0.01em; max-width: 16ch">Every move gave me <em style="font-style: italic">a new story to tell.</em></h2>
        <span aria-hidden="true" style="display: block; width: 64px; height: 1px; margin: 40px 0; background: #2f4156"></span>
      </div>
      <div style="width: 100%; display: flex; flex-direction: column; align-items: center">
        <p style="margin: 0; font-size: 17px; line-height: 1.85; max-width: 60ch">Born in Slovakia and raised in Vienna, Austria, I grew up between languages and cultures, often speaking one at home and another everywhere else. In my sophomore year of high school, I came to the United States as an exchange student, attending Newton South High School and living with a host family. What was supposed to be one year turned into something bigger. I thrived academically and saw opportunities in the American education system that I wanted to keep pursuing, so I decided to stay. To continue my studies as an international student, I transferred to the Williston Northampton School, a boarding school in Western Massachusetts, where I finished high school.</p>
        <div style="margin-top: 56px; width: 100%; max-width: 620px; border-top: 1px solid #2f4156; text-align: left">
        <div style="border-bottom: 1px solid #2f4156">
          <button type="button" onClick="{{a1}}" aria-expanded="{{ab1}}" style="width: 100%; min-height: 60px; padding: 16px 0; border: 0; background: transparent; color: #2f4156; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-family: 'Instrument Serif', Georgia, serif; font-size: 21px; text-transform: uppercase">Languages<span aria-hidden="true" class="acc-icon {{ac1}}" style="font-family: Jost, Arial, sans-serif; font-size: 24px; font-weight: 300; line-height: 1">+</span></button>
          <div class="acc {{ac1}}"><div class="acc-in"><p style="margin: 0; padding: 0 0 20px; font-size: 15px; line-height: 1.75">English is my fourth language, after Slovak, German and Russian. Learning to write, and eventually think, in it wasn’t an easy process, but it taught me persistence and how to find my place in unfamiliar environments. Today I speak English, German and Slovak fluently and understand Russian and Spanish, and each language has shaped how I see people and the world a little differently.</p></div></div>
        </div>
        <div style="border-bottom: 1px solid #2f4156">
          <button type="button" onClick="{{a2}}" aria-expanded="{{ab2}}" style="width: 100%; min-height: 60px; padding: 16px 0; border: 0; background: transparent; color: #2f4156; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-family: 'Instrument Serif', Georgia, serif; font-size: 21px; text-transform: uppercase">Currently<span aria-hidden="true" class="acc-icon {{ac2}}" style="font-family: Jost, Arial, sans-serif; font-size: 24px; font-weight: 300; line-height: 1">+</span></button>
          <div class="acc {{ac2}}"><div class="acc-in"><p style="margin: 0; padding: 0 0 20px; font-size: 15px; line-height: 1.75">I’m currently studying Communication and Media Studies at Northeastern University, with a minor in Philosophy. With so much of what we see today shaped by social media and AI, I think it’s more important than ever to question what we consume and how it’s presented. Philosophy helps me do that, and it connects closely to my interests in media and screenwriting, where the stories we tell influence how people see the world and each other.</p></div></div>
        </div>
        <div style="border-bottom: 1px solid #2f4156">
          <button type="button" onClick="{{a3}}" aria-expanded="{{ab3}}" style="width: 100%; min-height: 60px; padding: 16px 0; border: 0; background: transparent; color: #2f4156; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-family: 'Instrument Serif', Georgia, serif; font-size: 21px; text-transform: uppercase">Certificates<span aria-hidden="true" class="acc-icon {{ac3}}" style="font-family: Jost, Arial, sans-serif; font-size: 24px; font-weight: 300; line-height: 1">+</span></button>
          <div class="acc {{ac3}}"><div class="acc-in">
            <div style="padding: 0 0 22px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px">
              <p style="margin: 0; font-size: 15px; line-height: 1.6"><span style="font-weight: 400">CITI Program: Social &amp; Behavioral Research</span><br>Human Subjects Research, Basic Course<br>Northeastern University, completed October 2026</p>
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px">
                <button type="button" class="pill" onClick="{{openCert}}" style="min-height: 40px; padding: 10px 22px; border: 1px solid #2f4156; border-radius: 999px; background: transparent; color: #2f4156; font: 400 11px Jost, Arial, sans-serif; letter-spacing: 0.12em; cursor: pointer">VIEW CERTIFICATE</button>
                <a class="ul" href="https://www.citiprogram.org/verify/?w337246ea-6572-421b-82ad-1167bc87245c-80222318" target="_blank" rel="noopener noreferrer" style="padding: 8px 0; font-size: 11px; font-weight: 400; letter-spacing: 0.12em; text-decoration: none">VERIFY ↗</a>
              </div>
            </div>
          </div></div>
        </div>
        </div>
        <button type="button" class="pill" onClick="{{openResume}}" style="display: inline-block; margin-top: 48px; padding: 15px 34px; border: 0; border-radius: 999px; background: #2f4156; color: #f5efeb; font: 400 12px Jost, Arial, sans-serif; letter-spacing: 0.12em; cursor: pointer">VIEW MY RÉSUMÉ</button>
      </div>
    </div>
  </section>

  <sc-if value="{{resumeOpen}}" hint-placeholder-val="{{false}}">
    <div class="fade" role="dialog" aria-modal="true" aria-label="Résumé" style="position: fixed; inset: 0; z-index: 1000; overflow-y: auto; background: rgba(47, 65, 86, 0.92); box-sizing: border-box; padding: clamp(16px, 3vw, 40px)">
      <div style="max-width: 860px; margin: 0 auto">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px">
          <p style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 32px; color: #f5efeb">Résumé</p>
          <div style="display: flex; gap: 10px; flex-wrap: wrap">
            <a class="pill" href="assets/resume.pdf" target="_blank" rel="noopener" style="padding: 12px 24px; border: 1px solid #f5efeb; border-radius: 999px; color: #f5efeb; font-size: 12px; font-weight: 400; letter-spacing: 0.12em; text-decoration: none">OPEN PDF</a>
            <button type="button" class="pill" onClick="{{closeResume}}" style="min-height: 44px; padding: 12px 24px; border: 0; border-radius: 999px; background: #f5efeb; color: #2f4156; font: 400 12px Jost, Arial, sans-serif; letter-spacing: 0.12em; cursor: pointer">CLOSE</button>
          </div>
        </div>
        <img src="assets/resume.jpg" alt="Julianna Tatar’s résumé: education, experience, leadership and activities, skills and interests" style="display: block; width: 100%; height: auto; background: #FFFFFF; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25)">
      </div>
    </div>
  </sc-if>

  <sc-if value="{{certOpen}}" hint-placeholder-val="{{false}}">
    <div class="fade" role="dialog" aria-modal="true" aria-label="CITI Program certificate" style="position: fixed; inset: 0; z-index: 1000; overflow-y: auto; background: rgba(47, 65, 86, 0.92); box-sizing: border-box; padding: clamp(16px, 3vw, 40px)">
      <div style="max-width: 960px; margin: 0 auto">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px">
          <p style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 32px; color: #f5efeb">CITI Program certificate</p>
          <div style="display: flex; gap: 10px; flex-wrap: wrap">
            <a class="pill" href="assets/citi-certificate.pdf" target="_blank" rel="noopener" style="padding: 12px 24px; border: 1px solid #f5efeb; border-radius: 999px; color: #f5efeb; font-size: 12px; font-weight: 400; letter-spacing: 0.12em; text-decoration: none">OPEN PDF</a>
            <a class="pill" href="https://www.citiprogram.org/verify/?w337246ea-6572-421b-82ad-1167bc87245c-80222318" target="_blank" rel="noopener noreferrer" style="padding: 12px 24px; border: 1px solid #f5efeb; border-radius: 999px; color: #f5efeb; font-size: 12px; font-weight: 400; letter-spacing: 0.12em; text-decoration: none">VERIFY</a>
            <button type="button" class="pill" onClick="{{closeCert}}" style="min-height: 44px; padding: 12px 24px; border: 0; border-radius: 999px; background: #f5efeb; color: #2f4156; font: 400 12px Jost, Arial, sans-serif; letter-spacing: 0.12em; cursor: pointer">CLOSE</button>
          </div>
        </div>
        <img src="assets/citi-certificate.jpg" alt="CITI Program completion certificate for Julianna Tatar: Social and Behavioral Research, Human Subjects Research, Basic Course, Northeastern University, completed 10 October 2026" style="display: block; width: 100%; height: auto; background: #FFFFFF; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25)">
      </div>
    </div>
  </sc-if>
</div>
</template>
<template id="tpl-Journey">
<div class="page" style="font-family: Jost, 'Helvetica Neue', Arial, sans-serif; font-weight: 300; color: #2f4156; background: #f5efeb">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none"><img src="assets/martin-slovak-hills.jpg" alt="" style="width: 1px; height: 1px"><img src="assets/vienna-collage.jpg" alt="" style="width: 1px; height: 1px"></div>
  <sc-if value="{{showNav}}" hint-placeholder-val="{{true}}">
    <dc-import name="Nav" current="journey" hint-size="100%,112px"></dc-import>
  </sc-if>
  <section id="journey" style="background: #2f4156; color: #f5efeb; padding: 40px 24px 56px">
    <div style="max-width: 1200px; margin: 0 auto">
      <sc-if value="{{onMap}}" hint-placeholder-val="{{true}}">
      <div style="text-align: center">
        <p style="margin: 0; font-family: 'Mrs Saint Delafield', cursive; font-size: 46px; line-height: 0.8; color: #c8d9e6">follow me</p>
        <h2 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(40px, 5.5vw, 72px); line-height: 0.9; text-transform: uppercase">The Journey</h2>
        <p style="margin: 20px auto 0; font-size: 16px; line-height: 1.7; max-width: 46ch; color: #c8d9e6">Five places that shaped how I see, listen and write. Select a place to open its chapter.</p>
      </div>

      <div id="map" style="margin: 40px auto 0; position: relative; width: 100%; max-width: 820px; aspect-ratio: 2 / 1">
        <svg viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%">
          <path d="M0,50 L140,36 L215,80 L262,140 L298,196 L284,222 L304,248 L262,300 L238,360 L190,420 L128,500 L0,500 Z" fill="#364b62" stroke="#c8d9e6" stroke-opacity="0.55" stroke-width="1"></path>
          <path d="M1000,30 L712,26 L664,84 L630,150 L668,196 L646,258 L702,318 L684,404 L758,384 L812,446 L902,418 L1000,462 Z" fill="#364b62" stroke="#c8d9e6" stroke-opacity="0.55" stroke-width="1"></path>
          <text x="500" y="250" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-size="20" font-style="italic" fill="#c8d9e6" fill-opacity="0.8">Atlantic Ocean</text>
          <path class="route" d="M820,220 L770,270 C650,430 350,430 205,265 L120,230 Q190,186 255,215" fill="none" stroke="#c8d9e6" stroke-width="1.4" stroke-linecap="round"></path>
        </svg>
        <sc-for list="{{stops}}" as="item" hint-placeholder-count="5">
          <button type="button" class="pin" onClick="{{item.pick}}" aria-label="Go to chapter {{item.num}}: {{item.place}}" style="display: block; position: absolute; left: {{item.x}}%; top: {{item.y}}%; transform: translate(-50%, -50%); width: 44px; height: 44px; border: 0; padding: 0; background: transparent; cursor: pointer">
            <sc-if value="{{item.active}}" hint-placeholder-val="{{false}}">
              <span class="pin-ring"></span>
              <span style="position: absolute; inset: 0; margin: auto; width: 12px; height: 12px; border-radius: 50%; background: #f5efeb"></span>
            </sc-if>
            <sc-if value="{{item.idle}}" hint-placeholder-val="{{true}}">
              <span style="position: absolute; inset: 0; margin: auto; width: 8px; height: 8px; border-radius: 50%; background: #c8d9e6"></span>
            </sc-if>
            <span class="pin-label" style="position: absolute; left: {{item.lx}}; top: {{item.ly}}; white-space: nowrap; font-family: Jost, Arial, sans-serif; font-size: 12px; font-weight: 400; letter-spacing: 0.14em; color: #f5efeb">{{item.label}}</span>
          </button>
        </sc-for>
      </div>

      <div role="group" aria-label="Chapters" style="margin-top: 40px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 24px; border-top: 1px solid #576b82">
        <sc-for list="{{stops}}" as="item" hint-placeholder-count="5">
          <sc-if value="{{item.active}}" hint-placeholder-val="{{false}}">
            <button type="button" onClick="{{item.pick}}" aria-current="step" style="min-height: 64px; padding: 16px 0; border: 0; border-top: 2px solid #f5efeb; margin-top: -1px; background: transparent; color: #f5efeb; text-align: center; cursor: pointer; font-family: 'Instrument Serif', Georgia, serif; font-size: 22px">{{item.place}}</button>
          </sc-if>
          <sc-if value="{{item.idle}}" hint-placeholder-val="{{true}}">
            <button type="button" onClick="{{item.pick}}" style="min-height: 64px; padding: 16px 0; border: 0; border-top: 2px solid transparent; margin-top: -1px; background: transparent; color: #c8d9e6; text-align: center; cursor: pointer; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 22px">{{item.place}}</button>
          </sc-if>
        </sc-for>
      </div>

      </sc-if>
      <sc-if value="{{onChapter}}" hint-placeholder-val="{{false}}">
      <div class="fade">
      <div style="display: flex; justify-content: flex-start; margin-bottom: 20px"><button type="button" class="pill" onClick="{{backToMap}}" style="min-height: 46px; padding: 12px 26px; border: 1px solid #f5efeb; border-radius: 999px; background: transparent; color: #f5efeb; font: 400 12px Jost, Arial, sans-serif; letter-spacing: 0.12em; cursor: pointer">← BACK TO THE MAP</button></div>
      <div id="chapter" aria-live="polite" style="margin-top: 0">
        <sc-if value="{{c0}}" hint-placeholder-val="{{true}}"><div class="fade"><dc-import name="Martin" hint-size="100%,720px"></dc-import></div></sc-if>
        <sc-if value="{{c1}}" hint-placeholder-val="{{false}}"><div class="fade"><dc-import name="Vienna" hint-size="100%,1500px"></dc-import></div></sc-if>
        <sc-if value="{{c2}}" hint-placeholder-val="{{false}}"><div class="fade"><dc-import name="Newton" hint-size="100%,720px"></dc-import></div></sc-if>
        <sc-if value="{{c3}}" hint-placeholder-val="{{false}}"><div class="fade"><dc-import name="Northampton" hint-size="100%,720px"></dc-import></div></sc-if>
        <sc-if value="{{c4}}" hint-placeholder-val="{{false}}"><div class="fade"><dc-import name="Boston" hint-size="100%,720px"></dc-import></div></sc-if>
      </div>
      <div style="display: flex; justify-content: space-between; gap: 12px; margin-top: 24px">
        <button type="button" class="pill" onClick="{{prev}}" disabled="{{isFirst}}" style="min-height: 48px; padding: 12px 30px; border: 1px solid #f5efeb; border-radius: 999px; background: transparent; color: #f5efeb; font: 400 13px Jost, Arial, sans-serif; letter-spacing: 0.12em; cursor: pointer">PREVIOUS PLACE</button>
        <button type="button" onClick="{{backToMap}}" style="align-self: center; border: 0; background: transparent; cursor: pointer; font-family: Jost, Arial, sans-serif; padding: 12px 0; color: #c8d9e6; font-size: 13px; font-weight: 400; letter-spacing: 0.14em; text-decoration: underline; text-underline-offset: 5px">BACK TO THE MAP</button>
        <button type="button" class="pill" onClick="{{next}}" disabled="{{isLast}}" style="min-height: 48px; padding: 12px 30px; border: 1px solid #f5efeb; border-radius: 999px; background: transparent; color: #f5efeb; font: 400 13px Jost, Arial, sans-serif; letter-spacing: 0.12em; cursor: pointer">NEXT PLACE</button>
      </div>
      </div>
      </sc-if>
    </div>
  </section>
</div>

    <p style="margin: 14px 0 0; font-size: 12px; font-weight: 400; letter-spacing: 0.14em">WHERE I WAS BORN</p>
